<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/png" href="/evup-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paca</title>
    <script>(()=> {try{const stored=window.localStorage.getItem('theme');const mode=(stored==='light'||stored==='dark'||stored==='auto')?stored:'dark';const prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;const resolved=mode==='auto'?(prefersDark?'dark':'light'):mode;const root=document.documentElement;root.classList.remove('light','dark');root.classList.add(resolved);if(mode==='auto'){root.removeAttribute('data-theme')}else{root.setAttribute('data-theme',mode)}root.style.colorScheme=resolved;}catch(_e){}})();</script>
    <!-- Keep this list in sync with SUPPORTED_LANGUAGES in src/i18n/config.ts. Sets `lang` before first paint so locale-specific font rules (e.g. Vietnamese) apply immediately, avoiding a flash of the wrong font. -->
    <script>(()=> {try{const supported=['pt-BR','en','vi','ko','zh-CN','ja','es','fr'];const stored=window.localStorage.getItem('locale');const locale=supported.includes(stored)?stored:'pt-BR';document.documentElement.lang=locale;}catch(_e){}})();</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
