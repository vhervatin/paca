# Fork release pipeline (EVUP).
#
# Builds and pushes the fork's service images to GitHub Container Registry
# (GHCR) only — no DockerHub / npm, so it needs no extra secrets (GHCR auth
# uses the built-in GITHUB_TOKEN).
#
# Trigger: push a version tag, e.g.
#   git tag v0.9.4-evup.1 && git push origin v0.9.4-evup.1
# or run manually from the Actions tab (workflow_dispatch).
#
# Produces (owner is taken from the repo, so on this fork → vhervatin):
#   ghcr.io/<owner>/paca-api:<tag>
#   ghcr.io/<owner>/paca-web:<tag>
#   ghcr.io/<owner>/paca-realtime:<tag>
#
# After the first run, make each package Public (GitHub → your profile →
# Packages → paca-api → Package settings → Change visibility → Public) so
# EasyPanel can pull without credentials. Set PACA_VERSION on the api service
# at deploy time to the same tag so the home "update available" banner works.

name: evup-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Build and push ${{ matrix.name }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: services/api
          - name: web
            context: apps/web
          - name: realtime
            context: services/realtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/paca-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
